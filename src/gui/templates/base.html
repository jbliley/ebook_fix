<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ebook_fix &mdash; {{ filename }}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; color: #222; padding: 0 1rem; }
    h1 { font-size: 1.3rem; word-break: break-word; margin-bottom: 0.25rem; }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 2px solid #ddd; margin: 1rem 0 1.5rem; }
    .tabs a { padding: 0.6rem 1rem; text-decoration: none; color: #555; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tabs a.active { color: #2b6cb0; border-bottom-color: #2b6cb0; font-weight: 600; }
    .tabs a.disabled { color: #bbb; cursor: default; pointer-events: none; }
    pre { background: #f7f7f7; border: 1px solid #ddd; border-radius: 10px; padding: 1.5rem; white-space: pre-wrap; word-wrap: break-word; font-size: 0.9rem; line-height: 1.45; overflow-x: auto; }
    a.button, button.button { display: inline-block; margin-top: 1rem; background: #2b6cb0; color: white; padding: 0.55rem 1.1rem; border-radius: 6px; text-decoration: none; border: none; font-size: 0.95rem; cursor: pointer; }
    a.button:hover, button.button:hover { background: #2c5282; }
    a.button.secondary, button.button.secondary { background: #edf2f7; color: #2d3748; }
    a.button.secondary:hover, button.button.secondary:hover { background: #e2e8f0; }
    label { display: block; font-weight: 600; margin: 1.1rem 0 0.25rem; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
    textarea { min-height: 6rem; resize: vertical; }
    .mismatch-note { font-size: 0.85rem; color: #666; margin-top: 0.3rem; }
    .mismatch-choices { margin-top: 0.4rem; }
    .mismatch-choices button { background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 5px; padding: 0.3rem 0.6rem; font-size: 0.82rem; cursor: pointer; margin-right: 0.4rem; }
    .mismatch-choices button:hover { background: #e2e8f0; }
    .mismatch-tag { display: inline-block; background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.75rem; margin-left: 0.5rem; }
    .field-block { margin-bottom: 0.5rem; }
    .saved-banner { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .details-toggle { font-size: 0.85rem; margin-bottom: 0.75rem; color: #555; }
    .review-group { border: 1px solid #ddd; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
    .review-group h3 { font-size: 0.95rem; margin: 0 0 0.8rem; color: #444; word-break: break-word; }
    .review-item { display: flex; gap: 0.6rem; padding: 0.7rem 0; border-top: 1px solid #eee; }
    .review-item:first-of-type { border-top: none; }
    .review-item input[type=checkbox] { margin-top: 0.3rem; }
    .review-item .item-title { font-weight: 600; }
    .confidence-tag { display: inline-block; border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.75rem; margin-left: 0.5rem; }
    .confidence-corroborated { background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4; }
    .confidence-sequence-only { background: #fffaf0; color: #7b341e; border: 1px solid #fbd38d; }
    .confidence-needs-review { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    .review-preview { font-size: 0.85rem; color: #555; margin-top: 0.3rem; font-style: italic; }
    .review-notes { font-size: 0.8rem; color: #777; margin-top: 0.3rem; }
    .review-notes ul { margin: 0.2rem 0 0; padding-left: 1.2rem; }
    .empty-state { color: #666; }
    .staged-banner { background: #ebf8ff; border: 1px solid #90cdf4; color: #2c5282; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    .module-list { border: 1px solid #ddd; border-radius: 10px; padding: 0.4rem 1.4rem; margin: 1rem 0 1.5rem; }
    .module-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0; border-top: 1px solid #eee; }
    .module-row:first-child { border-top: none; }
    .result-summary { margin-top: 0.5rem; }
    .result-summary ul { padding-left: 1.3rem; }
  </style>
</head>
<body>
  <h1>{{ filename }}</h1>
  <div class="tabs">
    <a href="{{ url_for('book_analysis', session_id=session_id) }}" class="{{ 'active' if active_tab == 'analysis' else '' }}">Analysis</a>
    <a href="{{ url_for('book_metadata', session_id=session_id) }}" class="{{ 'active' if active_tab == 'metadata' else '' }}">Metadata</a>
    <a href="{{ url_for('book_review', session_id=session_id) }}" class="{{ 'active' if active_tab == 'review' else '' }}">Review</a>
    <a href="{{ url_for('book_repair', session_id=session_id) }}" class="{{ 'active' if active_tab == 'repair' else '' }}">Repair</a>
    <a class="disabled">Before / After (coming soon)</a>
  </div>
  {% block content %}{% endblock %}
</body>
</html>
