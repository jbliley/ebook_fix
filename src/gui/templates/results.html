<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ebook_fix &mdash; {{ filename }}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; color: #222; padding: 0 1rem; }
    h1 { font-size: 1.3rem; word-break: break-word; }
    pre { background: #f7f7f7; border: 1px solid #ddd; border-radius: 10px; padding: 1.5rem; white-space: pre-wrap; word-wrap: break-word; font-size: 0.9rem; line-height: 1.45; overflow-x: auto; }
    a.button { display: inline-block; margin-top: 1rem; background: #2b6cb0; color: white; padding: 0.55rem 1.1rem; border-radius: 6px; text-decoration: none; }
    a.button:hover { background: #2c5282; }
  </style>
</head>
<body>
  <h1>Analysis: {{ filename }}</h1>
  <pre>{{ output }}</pre>
  <a class="button" href="/">Analyze another book</a>
</body>
