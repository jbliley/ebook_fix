<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ebook_fix</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 4rem auto; color: #222; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-top: 0; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 2rem; margin-top: 1.5rem; }
    input[type=file] { margin: 1rem 0; }
    button { background: #2b6cb0; color: white; border: none; padding: 0.65rem 1.4rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #2c5282; }
    .error { color: #c53030; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>ebook_fix</h1>
  <p class="subtitle">Analyze and repair a single EPUB file.</p>
  <div class="card">
    <p>Choose an EPUB file to analyze. This runs entirely on your own computer &mdash; nothing is uploaded anywhere outside this program.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="epub_file" accept=".epub" required>
      <br>
      <button type="submit">Analyze</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
