# ebook_fix configuration
#
# Controls which repair modules -- and which individual fix inside
# each module -- are turned on. Everything defaults to `true`
# (enabled). Set anything to `false` to skip it.
#
# Delete this file (or pass no --config flag) to run with every fix
# enabled.

[modules]
epub3_upgrade = true
paragraph_repair = true
linebreak_repair = true
chapter_markup = true
chapter_title_cleanup = true
toc_cleanup = true
dead_link_repair = true
toc_generation = true
image_repair = true
whitespace_repair = true
gutenberg_repair = true
ellipsis_repair = true
apostrophe_repair = true
scene_break_repair = true
scene_opener_repair = true
scene_marker_repair = true
body_variant_repair = true
line_height_repair = true
reader_settings_repair = true
span_cleanup_repair = true
quote_style_repair = true
page_title_repair = true
class_cleanup_repair = true
unused_css_repair = true
stylesheet_dedupe_repair = true
junk_file_repair = true
hyphen_leftover_repair = true
paragraph_spacing_repair = true
paragraph_indent_repair = false
header_spacing_repair = true
text_size_repair = true
extra_page_break_repair = true
cover_repair = true
running_title_repair = true
metadata_repair = true
title_cleanup = true
identifier_repair = true

# ---------------------------------------------------------------------
# EPUB 3 Upgrade
# ---------------------------------------------------------------------
[epub3_upgrade]

# Upgrade EPUB 2.x (or older Open Packaging Format) books to EPUB 3:
# bumps the package version, adds the required dcterms:modified
# metadata entry, and generates an EPUB 3 Navigation Document. Runs
# first, before every other repair module. The existing NCX is left
# in place for backwards compatibility with EPUB2-only readers.
enabled = true

# ---------------------------------------------------------------------
# Paragraph Repair
# ---------------------------------------------------------------------
[paragraph_repair]

# Remove leftover empty <p></p> tags (conversion artifacts).
fix_empty_paragraphs = true

# Instead of deleting a blank paragraph that sits between two paragraphs
# of story text, turn it into a centered "* * *" scene break. Many books
# mark a scene change with a blank line, and deleting it joins the two
# scenes together. Only done when such blank lines are rare in the book
# (a book with one between most paragraphs is just padded, and those
# are still removed). Has no effect if fix_empty_paragraphs is false.
convert_spacers_to_scene_breaks = true

# Remove conversion-tool watermark/junk paragraphs
# (e.g. "Generated by ABC Amber LIT Converter").
fix_watermark_junk = true

# Merge paragraphs that were incorrectly split mid-sentence.
fix_mid_sentence_splits = true

# ---------------------------------------------------------------------
# Stray Line Break Removal
# ---------------------------------------------------------------------
[linebreak_repair]

# Remove a line break (<br/>) sitting at the very start or end of a
# paragraph or heading in the main story. These show up as an extra
# blank line between paragraphs. A line break in the middle of a
# paragraph is never touched.
remove_stray_breaks = true

# ---------------------------------------------------------------------
# Chapter Markup
# ---------------------------------------------------------------------
[chapter_markup]

# Wrap each confirmed chapter (see the chapter-detection scan in the
# analysis output) in its own <section epub:type="chapter">, with a
# page break before it. Only chapters the detector is confident about
# get split; weak/ambiguous candidates are left alone.
enabled = true

# ---------------------------------------------------------------------
# Chapter Title Cleanup
# ---------------------------------------------------------------------
[chapter_title_cleanup]

# A heading in the middle of a chapter that the book's original
# conversion cut into its own file, giving it its own table of
# contents entry. Only acted on when the numbered chapters on either
# side of the entry count straight through it (2, then the heading,
# then 3). The text is moved back onto the end of the chapter before
# it and the contents entry is removed.
merge_false_chapters = true

# Make the hyphen spacing in numbered chapter titles consistent
# ("9 - The Lull" vs "9-The Lull"), in the chapter heading and in
# every table of contents.
standardize_title_separators = true

# Which spacing to standardize on. "auto" follows whichever style most
# titles in the book already use (a tie goes to spaced). "spaced"
# forces "9 - The Lull". "tight" forces "9-The Lull".
separator_style = "auto"

# ---------------------------------------------------------------------
# TOC Cleanup
# ---------------------------------------------------------------------
[toc_cleanup]

# Drop a file from the reading order when it holds nothing at all (no
# text, no pictures) and nothing links to it, along with its table of
# contents entries. If that empty file stood in for the cover and the
# book has a real cover page outside the reading order, the cover page
# takes its place. Anything blocked is left alone and reported.
remove_empty_pages = true

# Remove a contents entry nested under an identical entry for the same
# file ("Contents" inside "Contents"). Anything nested under the
# duplicate moves up to the parent.
collapse_duplicate_entries = true

# Give a contents entry with no label a readable one (the first heading
# in the file, or "Parent (Part 2)", or "Section 3") instead of leaving
# readers to show a raw file path.
fill_blank_labels = true

# ---------------------------------------------------------------------
# Dead Link Cleanup
# ---------------------------------------------------------------------
[dead_link_repair]

# A link in the book's text to a file that is not in the book (a
# Contents page written for a deleted layout, say) is pointed at the
# table of contents entry whose label matches the link's text, when
# there is exactly one such entry, or else at the one chapter whose
# opening heading is the link's text (ignoring case, punctuation and a
# leading "Chapter"). Otherwise the link is removed and its text is kept.
repoint_from_contents = true

# A link to a spot (#something) that does not exist: a link into another
# file keeps going to that file, and a link to a spot on its own page is
# removed.
fix_missing_anchors = true

# ---------------------------------------------------------------------
# TOC Generation
# ---------------------------------------------------------------------
[toc_generation]

# For a book with no NCX and no EPUB3 nav document with any TOC
# entries at all, generate one from the book's detected chapter
# structure: a toc.ncx always, plus a nav.xhtml too if the book is
# EPUB3 and doesn't have one yet. A book with even a sparse or broken
# existing TOC is left alone -- this only ever fires when there's
# genuinely nothing there to begin with.
enabled = true

# ---------------------------------------------------------------------
# Image Repair
# ---------------------------------------------------------------------
[image_repair]

# Remove <img> tags in chapters whose file doesn't exist in the EPUB.
fix_broken_images = true

# Report (not fixed yet) manifest entries pointing at missing images.
report_missing_manifest_images = true

# ---------------------------------------------------------------------
# Whitespace Normalizer
# ---------------------------------------------------------------------
[whitespace_repair]

# Cleans up leading/trailing indentation, repeated whitespace, tabs,
# space before punctuation, and clearly missing spaces after sentence
# punctuation -- all DOM-aware, so pre/code/script/style/svg/math
# content is never touched. See the analysis output for a category
# breakdown before turning this off.
enabled = true

# Remove leading whitespace/indentation at the start of a text node.
fix_leading_indent = true

# Remove trailing whitespace/indentation at the end of a text node.
fix_trailing_indent = true

# Collapse runs of 2+ whitespace characters (anywhere, not just at
# the edges) down to a single space.
fix_repeated_whitespace = true

# Treat tab characters as whitespace at all. Turning this off leaves
# every tab untouched -- not just unconverted, but invisible to every
# other option above too, so a tab is never stripped or collapsed.
fix_tabs = true

# Remove a stray space/tab sitting directly before a punctuation mark
# (" ,text" -> ",text").
fix_space_before_punct = true

# Insert a missing space after . / ! / ? / , / ; / : where a new word
# or sentence clearly starts with no space at all. Narrow and
# conservative -- see the module docstring in ebook_fix/whitespace.py
# for exactly what it will and won't touch (things like "3.14",
# "U.S.A.", and "Mr.Smith" are deliberately left alone).
fix_missing_sentence_space = true

# Collapse a text/tail node that's nothing but whitespace down to a
# single space. Never deletes one outright, even between two
# block-level tags -- see the module docstring, "Standalone
# whitespace-only nodes", for why that's the safe default.
collapse_whitespace_only_nodes = true

# Replace a non-breaking space (U+00A0) with an ordinary space.
fix_nonbreaking_spaces = true

# Replace other Unicode space characters (en/em space, thin space,
# ideographic space, and similar Zs/Zl/Zp-category characters) with an
# ordinary space. Doesn't affect the non-breaking space above -- that
# has its own switch since it's the far more common case.
fix_unicode_whitespace = true

# Remove invisible zero-width characters that sometimes turn up as
# conversion artifacts (zero-width space, word joiner, and a stray
# byte-order-mark sitting inside the text itself, not the one at the
# very start of a file, which the EPUB reader already handles
# separately).
fix_zero_width_whitespace = true

# ---------------------------------------------------------------------
# Gutenberg Boilerplate Removal
# ---------------------------------------------------------------------
[gutenberg_repair]

# Remove the standard Project Gutenberg front disclaimer, wherever
# ebook_fix.gutenberg found it. Always a subtree cut (the disclaimer
# shares its file with real content in every conversion style seen so
# far) -- see the module docstring in
# ebook_fix/modules/gutenberg_repair.py for exactly what does and
# doesn't get swept.
fix_front_matter = true

# Remove the standard Project Gutenberg back license, wherever
# ebook_fix.gutenberg found it, plus any further spine files that are
# nothing but leftover license text with no marker of their own. Drops
# the whole file when the marker's file is nothing but boilerplate,
# otherwise a subtree cut like the front matter above.
fix_back_matter = true

# ---------------------------------------------------------------------
# Ellipsis Normalizer
# ---------------------------------------------------------------------
[ellipsis_repair]

# Normalize both a plain three-dot ASCII ellipsis ("...") and a
# spaced-dot ellipsis (". . .") to the same target style below.
enabled = true

# "unicode" (recommended) replaces both shapes with the single
# Unicode ellipsis character (…). It's plain UTF-8 text, which is
# what an EPUB's HTML content already is, so it displays correctly on
# every reading system. "ascii" instead cleans both shapes down to a
# tidy three-dot "..." with no internal spaces, for anyone who
# specifically wants to avoid the single character.
target_style = "unicode"

# ---------------------------------------------------------------------
# Apostrophe Repair
# ---------------------------------------------------------------------
# Embedded Stylesheet Consolidation
# ---------------------------------------------------------------------
[stylesheet_dedupe_repair]

# Only a repeated stylesheet at least this many bytes long is moved. Small
# rules that many converters stamp into every page (a 60-byte @page rule,
# say) are not worth a new file.
min_size = 1024

# When a book pastes the same stylesheet into the top of several of its
# files (a 42 KB block copied into 12 pages, say), it is moved into one
# shared stylesheet file and each page links to it instead. A block that
# only one file has, that differs between files, or that refers to other
# files from several folders is left alone.

# ---------------------------------------------------------------------
# Junk File Removal
# ---------------------------------------------------------------------
[junk_file_repair]

# Remove leftover files that do not belong in a finished book:
# calibre_bookmarks.txt, .DS_Store, Thumbs.db, desktop.ini and the
# __MACOSX folder. Nothing else in META-INF is ever touched.
remove_known_junk = true

# Remove a picture that is a byte-for-byte copy of another picture in the
# book. The declared cover (or else the copy the book uses) is kept; a page
# that shows the removed copy is pointed at the kept one. A copy used from a
# stylesheet or link is left alone.
remove_duplicate_images = true

# Remove a picture that nothing refers to at all and that has exactly the
# declared cover's width and height (a leftover copy of the cover saved in
# another format, so not an exact copy). Nothing else unused is touched.
remove_unused_cover_copy = true

# ---------------------------------------------------------------------
# Mid-Word Hyphen Repair
# ---------------------------------------------------------------------
[hyphen_leftover_repair]

# No options: turn this module on or off in the [modules] list above.
# Joins a word left split by a line-break hyphen ("colum-barium") when the
# book itself shows the joined word ("columbarium") is how it is normally
# spelled. A real compound ("well-known"), a hyphen after a prefix
# ("re-enter"), a heading and anything the book does not back up are left
# alone.

# ---------------------------------------------------------------------
# Paragraph Spacing
# ---------------------------------------------------------------------
[paragraph_spacing_repair]

# No options: turn this module on or off in the [modules] list above.
# When a book's main body-text style has BOTH an indent and a gap between
# paragraphs (an indent and a blank gap both say "new paragraph"), the gap
# is removed and the indent kept. Books that are indented with no gap, or
# spaced with no indent, are left alone, and the space under chapter
# headers is kept exactly as it was.

# ---------------------------------------------------------------------
# Text Size
# ---------------------------------------------------------------------
[text_size_repair]

# Fixes text that shows far too large (or small) in reading apps that
# ignore the size set on the page body, because the book sizes its text
# in two layers that only work together (for example a body size of
# 0.41667em with 1.8em on every span of text). Stylesheet-only, and does
# nothing when the stylesheet is too unusual to be sure.
enabled = true

# Also finds runs of text inside a paragraph (small caps and the like)
# that show far smaller or larger than the normal text, such as 0.556em
# on a name in capitals, and moves them to the nearest limit below. Only
# acts when every use of that size is a run inside normal-sized text.
fix_inline_size = true

# A run shown at less than inline_min or more than inline_max times the
# normal text size is moved to that limit (0.9 and 1.1 by default).
inline_min = 0.9
inline_max = 1.1

# ---------------------------------------------------------------------
# Chapter Header Spacing
# ---------------------------------------------------------------------
[header_spacing_repair]

# Keeps a visible gap under each chapter header (between the header and
# the first paragraph). Fewer blank lines than min_lines get topped up to
# min_lines; more than max_lines get cut down to max_lines. A header that
# is an image, or that the stylesheet already spaces, is left alone.
min_lines = 2
max_lines = 5
# Blank lines added directly above each chapter header (0 turns it off).
lines_before = 1
# Restyle a header that looks like body text (a Prologue) to match the
# other chapter headers.
match_header_style = true

# ---------------------------------------------------------------------
# Paragraph Indent
# ---------------------------------------------------------------------
[paragraph_indent_repair]

# When a book's main body-text style has NO indent and NO gap between
# paragraphs (a wall of text, as in many converted FB2 books), a first-line
# indent is added to show where each paragraph starts. Books that already
# indent, or that put a gap between paragraphs, are left alone, and so is
# any book where the stylesheet is too unusual to be sure.

# How far the first line is indented: a CSS length such as "1.5em" or "2em".
indent = "1.5em"

# Leave the first paragraph after a heading or a scene break flush left,
# the way printed books do. Set to false to indent every paragraph.
flush_first_paragraph = true

# ---------------------------------------------------------------------
# Scene Opener Markers
# ---------------------------------------------------------------------
[scene_opener_repair]

# No options: turn this module on or off in the [modules] list above.
# When on, a scene change that has no visible marker, only an opening in
# capitals ("THERE'S AN UNLIT parking lot behind ..."), gets a centered
# "* * *" in front of it. It only acts when the book clearly uses such
# openers as scene markers (at least five, rare among the paragraphs, all
# styled alike and unlike ordinary paragraphs), and never on the first
# thing in a file or right under a chapter header, rule, marker or blank
# spacer line.

# ---------------------------------------------------------------------
# Scene Break Markers
# ---------------------------------------------------------------------
[scene_marker_repair]

# No options: turn this module on or off in the [modules] list above.
# When on, a paragraph that holds only break ornaments ("# # #", "###",
# "***", "- - -", a row of dashes) becomes a centered "* * *" with a blank
# line above and below, and a "* * *" made by another module gets the same
# spacing. Anything with a letter or digit in it, a heading, a picture, and
# a one or two glyph ornament are left alone.

# ---------------------------------------------------------------------
# Body Paragraph Look
# ---------------------------------------------------------------------
[body_variant_repair]

# No options: turn this module on or off in the [modules] list above.
# When on, paragraphs set in a copy of the book's main body class that
# differs only in line height or top/bottom spacing (for example 8
# paragraphs at a line height of 150% in a book set at 1.2) are switched
# to the main body class. A class used on more than a quarter as many
# paragraphs as the body class is left alone.

# ---------------------------------------------------------------------
# Line Height
# ---------------------------------------------------------------------
[line_height_repair]

# Removes a tight, fixed line height from body text (for example the
# "line-height: 1.2" many Amazon and Calibre conversions put on every
# paragraph) so the reading app's own line spacing setting applies, which is
# usually roomier. Headings, display-size text, code and tables are left
# alone. Turn this module on or off in the [modules] list above.

# A fixed line height below this multiple of the font size is removed. A
# line height at or above it is left as it is.
min_line_height = 1.4

# ---------------------------------------------------------------------
# Reader Settings
# ---------------------------------------------------------------------
[reader_settings_repair]

# No options: turn this module on or off in the [modules] list above.
# Removes book-wide styling that a reading app has its own setting for, so
# the app's choice is not overwritten: on the body text, the line height,
# paragraph indent, gap between paragraphs, justify / left alignment, letter
# and word spacing; on the page, its margins and padding; anywhere,
# hyphenation switches and converter leftovers. The space under chapter
# headers is kept. Headings, centered titles, quotes, small caps and other
# one-off styling are left alone. Because the app now decides indents,
# paragraph_indent_repair is off by default.

# ---------------------------------------------------------------------
# Span Cleanup
# ---------------------------------------------------------------------
[span_cleanup_repair]

# No options: turn this module on or off in the [modules] list above.
# Unwraps <span> tags that do nothing, such as the converter spans whose
# style was removed by Reader Settings, and removes empty spans. A span with
# an id, a style, a language or any other attribute is never touched, and the
# text of every page is checked to be identical before and after.

# ---------------------------------------------------------------------
# Quote Style
# ---------------------------------------------------------------------
[quote_style_repair]

# No options: turn this module on or off in the [modules] list above.
# In a book that already uses curly quotes, turns the stray straight quotes
# and apostrophes into curly ones so the whole book matches. A book that
# mostly uses straight quotes, or a mixed one, is left alone, and inch and
# foot marks are never changed. Only the quote characters change, never a word.

# ---------------------------------------------------------------------
# Page Titles
# ---------------------------------------------------------------------
[page_title_repair]

# No options: turn this module on or off in the [modules] list above.
# Replaces a placeholder <title> in a page (Unknown, Untitled, a bare file
# name, or none at all) with the page's first heading, or the book's title
# when the page has no heading. Titles that already say something are left
# alone, and nothing in the page text is changed.

# ---------------------------------------------------------------------
# Class Cleanup
# ---------------------------------------------------------------------
[class_cleanup_repair]

# No options: turn this module on or off in the [modules] list above.
# Removes class names (the converter's calibre, calibre1, calibre2 and so
# on) that no style in the book mentions any more, so they can no longer
# affect how anything looks. Names used by ebook_fix itself are kept. Spans
# left with no attributes are then removed by Span Cleanup.

# ---------------------------------------------------------------------
# Unused CSS
# ---------------------------------------------------------------------
[unused_css_repair]

# No options: turn this module on or off in the [modules] list above.
# Removes style rules for classes that no page in the book uses (a converter
# writes a rule for every class in the original file). Rules for plain tags
# such as body, p and h1, @font-face and @page rules, and anything used by
# ebook_fix are kept. A book containing a script is left alone.

# ---------------------------------------------------------------------
[apostrophe_repair]

# Fixes a dropped-apostrophe conversion artifact: a contraction that
# lost its apostrophe and got left with a plain space instead, e.g.
# "don t" -> "don't", "it s" -> "it's". Matched against a closed
# whitelist of known contractions only, so this stays safe -- it will
# never touch a genuine two-word phrase that happens to share the
# same shape. Possessives ("the dog s bone") are a separate, much
# higher-false-positive-risk problem and are NOT handled by this
# module -- see docs/apostrophe_repair_plan.md.
enabled = true

# "auto" (recommended) follows whichever apostrophe style the book's
# own prose already uses -- straight (') or curly ('), per the
# Typography Overview in the analysis output -- so a repaired
# contraction matches the rest of the book. "straight" or "curly"
# force that character regardless of what the book already has.
target_style = "auto"

# ---------------------------------------------------------------------
# Scene Break Normalizer
# ---------------------------------------------------------------------
[scene_break_repair]

# Replace a genuine mid-chapter <hr> (real content on both sides
# before hitting the next chapter boundary) with a centered "* * *" --
# the conventional ebook rendering of a scene divider. A literal
# horizontal rule reads as a leftover web-page artifact to most
# readers.
enabled = true
replace_mid_chapter = true

# Remove an <hr> that sits at a chapter edge outright -- redundant
# with a boundary that's already marked some other way (a heading, a
# page break), not a real scene break.
remove_chapter_edge = true

# ---------------------------------------------------------------------
# Cover Repair
# ---------------------------------------------------------------------
[cover_repair]

# Only ever acts when analysis found exactly one clearly-resolved,
# existing, valid cover image -- an ambiguous or missing cover is
# reported, never guessed at.
enabled = true

# Add whichever of the EPUB2 <meta name="cover">/EPUB3
# properties="cover-image" declarations is missing, or fix one that
# disagrees with the other, so both point at the same image.
sync_declarations = true

# Rename the cover file to ebook_fix's standard "cover.<ext>"
# (extension matches the image's actual format, never converted),
# updating the manifest and any chapter that displays it (e.g. a
# dedicated cover.xhtml page) to match.
standardize_filename = true

# Remove a page that holds nothing but a second copy of the cover art,
# near the real cover page, so the cover isn't shown twice. Only
# acts on a page with no text and one image with the same shape as the
# cover, within the first few pages of the book.
remove_duplicate_cover_page = true

# Fix a cover <link> tag in a page header (for example Project
# Gutenberg's rel="icon" type="image/x-cover") that names a cover file
# which no longer exists, typically because the cover was renamed. The
# tag is pointed at the book's real cover. A link to a file that exists
# is never changed.
fix_stale_links = true

# ---------------------------------------------------------------------
# Running Title Removal
# ---------------------------------------------------------------------
[running_title_repair]

# Remove a book-title heading repeated as a running header at the top
# of every chapter -- a conversion-tool leftover (a shared template
# stamping the book's own title into every page, not just its actual
# title page). Only ever touches a CONFIRMED chapter's own leading
# content, never front matter (a real title page, a Contents page) --
# see ebook_fix/running_title.py for exactly what counts as a match.
enabled = true

# ---------------------------------------------------------------------
# Metadata Sync
# ---------------------------------------------------------------------
[metadata_repair]

# Only ever acts on a Calibre-managed book (one with a metadata.opf
# sidecar next to it) -- that sidecar is treated as a second source
# confirming the value, which is what makes writing here safe to run
# automatically. A standalone EPUB with no such backup is left alone,
# same as before (still just flagged for review if anything looks
# off). Only writes a field when metadata.merge has already ruled out
# ambiguity: the EPUB and metadata.opf already agree, one side was
# simply empty, or the two sides are the same value in a different
# rendering (e.g. "Smith, John" vs "John Smith"). A genuine
# disagreement is never auto-written -- see docs/metadata_plan.md.
enabled = true

# Also write the same resolved values into the metadata.opf sidecar
# itself (not just the EPUB), so the correction shows up in Calibre
# and Calibre-Web too, not only in the repaired EPUB file.
sync_calibre_opf = true

# Language the Metadata tab's "Use default language" button sets (handy for
# books whose language is blank or "undetermined"). "system" uses this
# computer's language (English if it can't be told), or give a code such
# as "en". "off" hides the button.
default_language = "system"

# Also write the same values into Calibre's own metadata.db via the
# calibredb command-line tool, so Calibre's library view reflects the
# correction immediately, without a re-scan. Off by default --
# requires calibredb to be installed and on PATH (or in one of the
# usual Windows install locations), and hasn't been verified yet
# against a real Calibre library. Turn this on once that's confirmed
# to work well on your machine -- see docs/metadata_plan.md.
sync_calibre_db = true

# ---------------------------------------------------------------------
# Title Cleanup
# ---------------------------------------------------------------------
[title_cleanup]

# Drop the author (and any series number) from a title that is really a
# leftover filename, like "Kadrey, Richard - 01 Sandman Slim - Sandman
# Slim", which becomes "Sandman Slim". Only done when the first or last
# " - " piece of the title is the book's own author, so an ordinary
# title that happens to contain a dash is never touched. A sort title
# holding the same junk is cleaned to match.
strip_author_from_title = true

# When that title spelled out a series name and number ("01 Sandman
# Slim"), record it as the book's series (in both the Calibre and EPUB 3
# forms), but only if the book has no series set yet.
read_series_from_title = true

# Rewrite a "Last, First" author as "First Last". Only done when the
# OPF's own sort name matches the same text, or the title started with
# it. The sort name keeps the comma form. Several authors, suffixes
# like "Jr." and company names are left alone.
fix_author_order = true

# Take a series tag written inside the title out of it and record it as
# the book's series, but only if the book has no series set yet. Forms
# recognized: "Title (Series #3)", "Title (Series, Book 3)", "Title
# [Series Vol. 3]", "Title (Book 3 of the Series)", "Series #3: Title" and
# "Series, Book 3 - Title". A tag with no marker ("Title (Series 3)") is
# left alone, since a bare number could be an edition or part of the title.
read_embedded_series = true

# ---------------------------------------------------------------------
# Identifier Standardize
# ---------------------------------------------------------------------
[identifier_repair]

# Rewrites every <dc:identifier> into a clean, correctly-scoped form:
# a garbled or missing opf:scheme attribute is corrected once the
# value's own shape (or an embedded label like "ISBN: ") confidently
# matches a known scheme in identifier_schemes.json, the value itself
# is cleaned up (dashes/spaces stripped, case normalized, etc. per
# that scheme's own rule), and an exact duplicate that results after
# cleanup is dropped. Runs on every book, Calibre-managed or not --
# unlike metadata_repair, this doesn't need a second source to be
# confident, just the scheme's own regex. An identifier that doesn't
# match any known scheme is left as an honest, unscoped bare-DC entry,
# same as before -- never guessed at.
enabled = true
